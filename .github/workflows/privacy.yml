name: Privacy gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files and complete reachable history
        run: python3 scripts/privacy_scan.py --ref HEAD
      - name: Install runtime dependency
        run: python3 -m pip install --requirement requirements.txt
      - name: Run tests
        run: python3 -m unittest discover -s tests
